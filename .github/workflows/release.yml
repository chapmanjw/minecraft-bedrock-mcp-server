name: Release

# Builds the Docker image and publishes it to the GitHub Container Registry
# on every version tag. The image is named after the repository, so it lands
# at ghcr.io/<owner>/<repo> and links back to this repository automatically.

on:
  push:
    tags: ["v*"]

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags and OCI labels from the git tag. With the default
      # `latest=auto` flavor, `latest` is applied only to non-prerelease
      # semver tags — a `v1.2.0-rc.1` tag will not move `latest`.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes the package to the public npm registry on every version tag.
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public

  # Creates the GitHub Release once the npm package and image are published.
  github-release:
    needs: [publish-npm, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the distributable tarball
        run: |
          npm ci
          npm run build
          npm pack

      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no changelog section for $version; falling back to generated notes"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --verify-tag)
          if [ -s notes.md ]; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          # A tag with a pre-release suffix (e.g. v1.0.0-rc.1) is a pre-release.
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            ./minecraft-bedrock-mcp-server-*.tgz
